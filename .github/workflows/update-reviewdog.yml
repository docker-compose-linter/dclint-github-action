name: Sync Reviewdog version
on:
  schedule:
    - cron: '14 14 * * *' # Runs at 14:14 UTC every day
  repository_dispatch:
    types: [ depup ]
  workflow_dispatch:

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: haya14busa/action-depup@94a1aaf4e4923064019214b48a43276218af7ad5 # v1.6.4
        id: depup
        with:
          file: reviewdog-action/action.yml
          version_name: REVIEWDOG_VERSION
          repo: reviewdog/reviewdog

      - name: Create Pull Request to update Reviewdog
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "deps: update Reviewdog to v${{ steps.depup.outputs.latest }}"
          commit-message: "feat: update Reviewdog to v${{ steps.depup.outputs.latest }}"
          body: |
            Update Reviewdog to [v${{ steps.depup.outputs.latest }}](https://github.com/reviewdog/reviewdog/releases/tag/v${{ steps.depup.outputs.latest }})
            Compare [v${{ steps.depup.outputs.current }}...v${{ steps.depup.outputs.latest }}](https://github.com/reviewdog/reviewdog/compare/v${{ steps.depup.outputs.current }}...v${{ steps.depup.outputs.latest }})

            This PR is auto generated.
          branch: chore/bump-reviewdog-${{ steps.depup.outputs.latest }}
          delete-branch: true
          labels: "dependencies"